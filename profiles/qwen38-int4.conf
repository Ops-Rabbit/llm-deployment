PROFILE_MODEL_FAMILY="qwen3.8-int4"
PROFILE_DEFAULT_RUNTIME="vllm"
PROFILE_ALLOWED_RUNTIMES="sglang vllm"
PROFILE_GPU_COUNT=1
PROFILE_MIN_GPU_MEMORY_MIB=23000
PROFILE_MIN_COMPUTE_CAPABILITY="7.5"
PROFILE_MIN_SYSTEM_MEMORY_MIB=65536
PROFILE_MIN_DATA_GIB=60
PROFILE_CONTEXT_LENGTH=32768
PROFILE_REQUIRES_CUSTOM_MODEL=true
PROFILE_PRESERVE_FAMILY_ON_MODEL_OVERRIDE=true
PROFILE_SGLANG_ARGS=(--reasoning-parser qwen3 --tool-call-parser qwen3_coder)
PROFILE_VLLM_ARGS=(--reasoning-parser qwen3 --tool-call-parser qwen3_coder --enable-auto-tool-choice)
